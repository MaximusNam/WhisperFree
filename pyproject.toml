[project]
name = "whisperfree"
version = "0.1.0"
description = "Голосовой ввод для Windows: зажал клавишу, сказал, отпустил — текст вставился в любое поле"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "speech-to-text",
    "dictation",
    "voice-input",
    "whisper",
    "windows",
    "push-to-talk",
    "groq",
    "голосовой-ввод",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Russian",
    "Natural Language :: English",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Utilities",
]
dependencies = [
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "numpy>=1.26",
    "pynput>=1.7.7",
    "pystray>=0.19.5",
    "Pillow>=10.0",
    "httpx>=0.27",
    "tomlkit>=0.13",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/MaximusNam/WhisperFree"
Repository = "https://github.com/MaximusNam/WhisperFree"
Issues = "https://github.com/MaximusNam/WhisperFree/issues"
Changelog = "https://github.com/MaximusNam/WhisperFree/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
build = ["pyinstaller>=6.0"]

[project.scripts]
whisperfree = "whisperfree.__main__:main"

[build-system]
# setuptools 77 и новее: только там понимают license = "MIT" по PEP 639.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["whisperfree*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
